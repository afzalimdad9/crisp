name: WiseEdit
options:
  bundleIdPrefix: com.wisedt
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Apple-Silicon only (WhisperKit/MLX has no x86_64 slice; cloud serves Intel).
    ARCHS: arm64
    # Ad-hoc sign so the app runs locally without a developer team.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: "1.0.0"

targets:
  WiseEdit:
    type: application
    platform: macOS
    sources:
      - path: WiseEdit
    info:
      path: WiseEdit/Info.plist
      properties:
        CFBundleDisplayName: Crisp
        LSApplicationCategoryType: public.app-category.video
        CFBundleDocumentTypes:
          - CFBundleTypeName: Crisp Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.wisedt.wiseproj
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.wisedt.wiseproj
            UTTypeDescription: Crisp Project
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - wiseproj
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wisedt.WiseEdit
        # Visible app name is "Crisp"; module stays "WiseEdit" so tests/imports
        # and the saved bundle id are untouched.
        PRODUCT_NAME: Crisp
        PRODUCT_MODULE_NAME: WiseEdit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
      configs:
        # Debug: automatic signing on the paid team so the Sign in with Apple
        # entitlement gets a real provisioning profile (ad-hoc can't sign it).
        # Release stays ad-hoc; release.sh re-signs with Developer ID for dist.
        Debug:
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: 99V2WR47H6
          CODE_SIGN_IDENTITY: Apple Development
          CODE_SIGN_ENTITLEMENTS: WiseEdit/WiseEdit.entitlements
    dependencies:
      - package: WhisperKit
        product: WhisperKit
    scheme:
      testTargets:
        - WiseEditTests

  WiseEditTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: WiseEditTests
    dependencies:
      - target: WiseEdit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # The app's product is renamed to "Crisp", so point the test host at it.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Crisp.app/Contents/MacOS/Crisp"
        BUNDLE_LOADER: "$(TEST_HOST)"
